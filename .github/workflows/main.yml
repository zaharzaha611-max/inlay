name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build --stacktrace
      - name: Find render layer class
        if: failure()
        run: |
          for j in $(find "$HOME/.gradle" . -name "*.jar" -path "*loom*" 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/client/render/RenderLayer.class"; then
              echo "=== JAR: $j"
              classes=$(unzip -l "$j" | awk '{print $4}' | grep -E '^net/minecraft/client/render/[A-Za-z]+\.class$' | sed 's/\.class$//; s#/#.#g')
              javap -cp "$j" -public $classes 2>/dev/null | awk '/(class|interface|enum) net\.minecraft/{cls=$0} /entityCutoutNoCull\(net\.minecraft\.util\.Identifier\)/{print "FOUND IN: " cls}'
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: inlay-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
